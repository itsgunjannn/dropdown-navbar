<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;

        }

        ul {
            list-style: none;
            display: flex;
        }

        ul li {
            background: black;
            width: 260px;
            text-align: center;
            border: 2px solid white;

        }

        ul li a {
            display: block;
            padding: 18px 0;
            color: limegreen;
            text-decoration: none;
            font-size: 22px;

        }

        ul li a:hover {
            background: darkseagreen;
            color: white;
        }



        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: lightblue;
            width: 200px;
            padding: 12px 16px;
        }


        .dropdown:hover .dropdown-content {
            display: block;
        }


        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: whitesmoke;
            color: black;
        }
    </style>
</head>

<body>
    <ul>
        <li class="dropdown">
            <a href="#">Home</a>
            <div class="dropdown-content">
                <a href="#">Dashboard</a>
                <a href="#">Latest News</a>
            </div>
        </li>

        <li class="dropdown">
            <a href="#">About Us</a>
            <div class="dropdown-content">
                <a href="#">Our Team</a>
                <a href="#">Company</a>
                <a href="#">Mission</a>
            </div>
        </li>


        <li class="dropdown">
            <a href="#">Products</a>
            <div class="dropdown-content">
                <a href="#">Mobiles</a>
                <a href="#">Laptops</a>
            </div>
        </li>

        <li class="dropdown">
            <a href="#">Our Clients</a>
            <div class="dropdown-content">
                <a href="#">Reviews</a>
                <a href="#">Projects</a>
            </div>
        </li>

        <li class="dropdown">
            <a href="#">Career</a>
            <div class="dropdown-content">
                <a href="#">Jobs</a>
                <a href="#">Internships</a>
            </div>
        </li>

        <li class="dropdown">
            <a href="#">Contact Us</a>
            <div class="dropdown-content">
                <a href="#">Email</a>
                <a href="#">Phone no.</a>
            </div>
        </li>



    </ul>

</body>

</html>

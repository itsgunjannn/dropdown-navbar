<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Using DIV</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: serif;
        }

        .bg {
            height: 650px;
            width: 1360px;
            background-color: gray;
            margin: auto;
            position: relative;
        }

        .top {
            height: 150px;
            width: 100%;
            background-color: palevioletred;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10px;
        }

        .title {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        ul {
            list-style: none;
            display: flex;
            background-color: black;
        }

        ul li {
            position: relative;
        }

        ul li a {
            display: block;
            padding: 12px 22px;
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        ul li a:hover {
            background-color: white;
            color: black;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            position: absolute;
            background-color: lightblue;
            padding: 12px 16px;
            display: none;
            width: 200px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            text-decoration: none;
            padding: 12px 16px;
            color: black;
            display: block;
        }
    </style>
</head>

<body>

    <div class="bg">

        <div class="top">
            <div class="title">
                Menu Create Using DIV Tag
            </div>
        </div>


        <div class="menu">
            <ul>
                <li class="dropdown">
                    <a href="#home">Home</a>
                    <div class="dropdown-content">
                        <a href="#">Dashboard</a>
                        <a href="#">Latest News</a>
                    </div>
                </li>

                <li class="dropdown">
                    <a href="#about">About</a>
                    <div class="dropdown-content">
                        <a href="#">Company</a>
                        <a href="#">Our Team</a>
                        <a href="#">Mission</a>
                    </div>
                </li>

                <li class="dropdown">
                    <a href="#profile">Profile</a>
                    <div class="dropdown-content">
                        <a href="#">Our Profile</a>
                    </div>
                </li>

                <li class="dropdown">
                    <a href="#gallery">Gallery</a>
                    <div class="dropdown-content">
                        <a href="#">Photos</a>
                        <a href="#">Videos</a>
                    </div>
                </li>

                <li class="dropdown">
                    <a href="#contact">Contact</a>
                    <div class="dropdown-content">
                        <a href="#">Phone No.</a>
                        <a href="#">Email</a>
                    </div>
                </li>
            </ul>
        </div>

    </div>

</body>

</html>

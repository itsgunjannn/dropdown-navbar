<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .bg {
            height: 460px;
            width: 970px;
            background-color: lightgray;
            margin: auto;
            position: static;
            top: 25px;
            position: relative;
        }


        .top {
            height: 55px;
            width: 970px;
            background-color: burlywood;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }


        ul {
            padding: 0;
            margin: 0;
            background-color: black;
            list-style-type: none;
            display: flex;
        }


        .again {
            position: relative;
        }

        li a {
            display: block;
            padding: 8px 15px;
            color: white;
            text-decoration: none;
        }

        li a:hover {
            background-color: burlywood;
            color: white;

        }

        ul li {
            list-style: none;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            position: absolute;
            background-color: white;
            padding: 12px 16px;
            display: none;
            width: 200px;


        }

        .dropdown:hover .dropdown-content {
            display: block;

        }

        .dropdown-content a {
            padding: 12px 16px;
            color: black;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: bisque;
            color: darkblue;
        }
    </style>

</head>

<body>

                        </div>
                    </li>


                    <li class="dropdown"><a href="Contact"><img
                                src="C:\Users\DELL\Downloads\1920px-Lotus_flower_(978659).jpg"
                                width="30px vertical-align:middle">Contact</a>

                        <div class="dropdown-content">
